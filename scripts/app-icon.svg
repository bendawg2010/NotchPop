<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    NotchPop macOS App Icon
    - Pure black rounded-square base (continuous corners approximation via large radius)
    - Notch silhouette in the upper third with a brand-gradient halo
    - Three minimal horizontal bars below hinting at expanded-notch widgets
  -->
  <defs>
    <!-- Brand gradient: pink -> purple -> blue -->
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF3CAC"/>
      <stop offset="50%" stop-color="#784BA0"/>
      <stop offset="100%" stop-color="#2B86C5"/>
    </linearGradient>

    <!-- Radial halo behind the notch, brand-colored, fades to transparent -->
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"  stop-color="#FF3CAC" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#784BA0" stop-opacity="0.75"/>
      <stop offset="80%" stop-color="#2B86C5" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#2B86C5" stop-opacity="0"/>
    </radialGradient>

    <!-- Subtle gradient for the rounded-square base to give it a hint of depth -->
    <linearGradient id="base" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#0A0A0A"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>

    <!-- Notch silhouette path:
         flat top, two rounded bottom corners (Apple hardware-notch shape).
         Reused for both the inner black notch AND for clipping the halo so the
         halo only appears as a glow ring around the notch, not inside it.
         Centered horizontally, sits in the upper third. -->
    <symbol id="notch" overflow="visible">
      <!-- Notch is roughly 360 wide, 110 tall, with 55px bottom corner radius.
           Drawn relative to (0,0) at top-left of the notch bounding box. -->
      <path d="M 0,0
               L 360,0
               L 360,55
               Q 360,110 305,110
               L 55,110
               Q 0,110 0,55
               Z"/>
    </symbol>

    <!-- Mask: white halo ring with the notch shape cut out (black) so the halo
         glows AROUND the notch, not through it. -->
    <mask id="haloMask" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="white"/>
      <use href="#notch" x="332" y="240" fill="black"/>
    </mask>
  </defs>

  <!-- Rounded-square base (large radius approximates macOS continuous corners) -->
  <rect x="0" y="0" width="1024" height="1024" rx="225" ry="225" fill="url(#base)"/>

  <!-- Brand-gradient halo behind the notch, masked so it forms a glow ring -->
  <g mask="url(#haloMask)">
    <ellipse cx="512" cy="295" rx="340" ry="200" fill="url(#halo)"/>
  </g>

  <!-- Solid black notch silhouette on top of the halo -->
  <use href="#notch" x="332" y="240" fill="#000000"/>

  <!-- Thin brand-gradient outline tracing the notch edge for crispness at small sizes -->
  <use href="#notch" x="332" y="240" fill="none" stroke="url(#brand)" stroke-width="6" stroke-linejoin="round"/>

  <!-- Three minimal horizontal bars below the notch, hinting at widgets/tabs -->
  <g fill="url(#brand)">
    <rect x="282" y="540" width="460" height="36" rx="18" ry="18"/>
    <rect x="332" y="630" width="360" height="28" rx="14" ry="14" opacity="0.75"/>
    <rect x="382" y="710" width="260" height="22" rx="11" ry="11" opacity="0.5"/>
  </g>
</svg>
