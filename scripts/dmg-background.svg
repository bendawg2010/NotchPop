<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" width="560" height="360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c0410"/>
      <stop offset="1" stop-color="#1a0a24"/>
    </linearGradient>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF3CAC"/>
      <stop offset=".5" stop-color="#784BA0"/>
      <stop offset="1" stop-color="#2B86C5"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FF3CAC" stop-opacity=".40"/>
      <stop offset="1" stop-color="#FF3CAC" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#2B86C5" stop-opacity=".40"/>
      <stop offset="1" stop-color="#2B86C5" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Backdrop -->
  <rect width="560" height="360" fill="url(#bg)"/>

  <!-- Atmosphere -->
  <ellipse cx="120" cy="180" rx="200" ry="180" fill="url(#glow1)"/>
  <ellipse cx="440" cy="180" rx="200" ry="180" fill="url(#glow2)"/>

  <!-- Decorative notch pill at top center -->
  <rect x="246" y="0" width="68" height="14" fill="#000" rx="0" ry="0"/>
  <path d="M246 14 Q246 22 254 22 L306 22 Q314 22 314 14 Z" fill="#000"/>

  <!-- Title text -->
  <text x="280" y="58" text-anchor="middle"
        font-family="-apple-system, SF Pro Display, system-ui, sans-serif"
        font-size="22" font-weight="900" fill="#fff" letter-spacing="-0.4">
    Drag NotchPop to Applications
  </text>
  <text x="280" y="84" text-anchor="middle"
        font-family="-apple-system, SF Pro Text, system-ui, sans-serif"
        font-size="13" font-weight="600" fill="#ffffff" opacity=".6">
    Then close this window and double-click NotchPop in your Applications folder.
  </text>

  <!-- Arrow from app to applications folder -->
  <path d="M210 220 Q280 200 350 220"
        stroke="url(#grad)" stroke-width="4" fill="none"
        stroke-linecap="round" opacity=".85"/>
  <!-- Arrowhead -->
  <path d="M338 212 L354 220 L340 230"
        stroke="url(#grad)" stroke-width="4" fill="none"
        stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>

  <!-- Footer hint -->
  <text x="280" y="338" text-anchor="middle"
        font-family="-apple-system, SF Pro Text, system-ui, sans-serif"
        font-size="11" font-weight="600" fill="#ffffff" opacity=".35">
    Free · Open Source · MIT
  </text>
</svg>
