name: NotchPop
options:
  bundleIdPrefix: com.benburnette
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    OTHER_CODE_SIGN_FLAGS: "--timestamp=none"
    GENERATE_INFOPLIST_FILE: NO
    # SOURCE OF TRUTH for the app version. release.sh updates this line
    # via sed, then xcodegen regenerates Info.plist with $(MARKETING_VERSION)
    # interpolated into CFBundleShortVersionString. The pre-v1.5.7 release
    # script set Info.plist directly with PlistBuddy, but xcodegen wiped
    # those mutations on the next regen — so every shipped DMG had
    # CFBundleShortVersionString=1.0 internally, breaking Sparkle's
    # version comparison and creating an endless 'update available' loop.
    MARKETING_VERSION: "1.5.17"
    CURRENT_PROJECT_VERSION: "13"

# Sparkle handles auto-updates. The framework gets pulled in via SPM
# (Swift Package Manager) — Xcode embeds it in NotchPop.app/Contents/
# Frameworks/. Each release the build script signs the new DMG with
# our private EdDSA key (in Keychain) and adds an entry to the
# appcast.xml that Sparkle polls every few hours.
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.9.1"

targets:
  NotchPop:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: App/Assets.xcassets
    dependencies:
      - package: Sparkle
        product: Sparkle
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: NotchPop
        # CRITICAL: these MUST be in info.properties — xcodegen
        # regenerates Info.plist on every build, blowing away anything
        # set by external tools (PlistBuddy, sed). Both reference build
        # settings so updating MARKETING_VERSION in one place propagates.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.utilities
        LSUIElement: true
        NSPrincipalClass: NSApplication
        NSHumanReadableCopyright: "Free · MIT licensed"
        # Without this, macOS Sequoia silently blocks our AppleScript
        # reads of Apple Music / Spotify state (the playpause commands
        # work because they trigger a one-time permission prompt; reads
        # die quietly). The text here shows in the consent dialog.
        NSAppleEventsUsageDescription: "NotchPop reads what's playing in Apple Music and Spotify so the Music tab can show your current track."
        # EventKit access — needed by the Calendar peek widget
        NSCalendarsUsageDescription: "NotchPop shows your next few calendar events in the Calendar tab inside the notch."
        NSCalendarsFullAccessUsageDescription: "NotchPop shows your next few calendar events in the Calendar tab inside the notch."
        # CoreLocation — Weather tab fetches your local conditions from
        # Open-Meteo using your coarse (city-level) location. We never
        # send the location anywhere except to Open-Meteo (and ipapi.co
        # as a fallback if you've denied CoreLocation entirely).
        NSLocationWhenInUseUsageDescription: "NotchPop fetches your local weather using a coarse city-level location. The Weather tab shows current temperature and conditions."
        NSLocationUsageDescription: "NotchPop fetches your local weather using a coarse city-level location. The Weather tab shows current temperature and conditions."
        # ---- Sparkle auto-update keys ----
        # Public key from the matching private key in Keychain. Sparkle
        # rejects any appcast entry whose ed25519 signature doesn't
        # verify against this — so even if our website is compromised,
        # an attacker can't push a malicious update.
        SUPublicEDKey: "CfYNfRbvojf1x4iugpkQGkwNjJCbM5EqSFeIVgyAnu8="
        # Where Sparkle polls for new versions. The script that
        # publishes a release also re-deploys this file.
        SUFeedURL: "https://notchpop.pages.dev/appcast.xml"
        # Check every 4 hours by default (the user can change in Settings).
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 14400
        # FALSE on purpose. SUAutomaticallyUpdate=true silently downloads
        # the new DMG and queues the swap for the next relaunch — but
        # for some users on macOS 14/15 the swap never lands (Sparkle's
        # XPC autoupdate service hits a code-signing edge case for
        # ad-hoc-signed builds). The user gets trapped in a state where
        # Sparkle keeps reporting "you're up to date" because the
        # download is staged, while CFBundleShortVersionString stays on
        # the old version forever. Explicit prompts every time means
        # the user actually sees each new version land.
        SUAutomaticallyUpdate: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.benburnette.NotchPop
        PRODUCT_NAME: NotchPop
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: App/NotchPop.entitlements
        LD_RUNPATH_SEARCH_PATHS:
          - "@executable_path/../Frameworks"
        ENABLE_PREVIEWS: YES
